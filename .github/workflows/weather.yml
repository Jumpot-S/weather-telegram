name: weather-alert

on:
  schedule:
    # เริ่มก่อนเวลาส่งจริง 15 นาที เพราะ GitHub มักเริ่มรันช้า สคริปต์จะรอจนถึงเวลาไทยที่กำหนดเอง
    # เวลาส่งจริง (ไทย) 05:00 11:00 15:00 18:00 21:00 = เริ่มรัน 04:45 10:45 14:45 17:45 20:45
    # เวลา UTC (ไทย-7): 21:45, 03:45, 07:45, 10:45, 13:45
    - cron: "45 21,3,7,10,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Send Telegram weather report
        run: python3 telegram/weather_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TIMES: ${{ vars.SEND_TIMES }}
          PLACE_NAME: ${{ vars.PLACE_NAME }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          PM_THRESHOLD: ${{ vars.PM_THRESHOLD }}
          HEAT_THRESHOLD: ${{ vars.HEAT_THRESHOLD }}
          RAIN_THRESHOLD: ${{ vars.RAIN_THRESHOLD }}
          UV_THRESHOLD: ${{ vars.UV_THRESHOLD }}
